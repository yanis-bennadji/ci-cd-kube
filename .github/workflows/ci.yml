name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Compute build variables (dev vs prod)
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            app_env=production
            app_version="${GITHUB_REF_NAME#v}"
          else
            app_env=development
            app_version="dev-${GITHUB_SHA::7}"
          fi
          echo "app_env=${app_env}" >> "$GITHUB_OUTPUT"
          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "Building ${app_env} image, version ${app_version} (ref: ${GITHUB_REF})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_ENV=${{ steps.vars.outputs.app_env }}
            APP_VERSION=${{ steps.vars.outputs.app_version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.0'

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [[ -z "$KUBE_CONFIG" ]]; then
            echo "::error::Secret KUBE_CONFIG is not set, cannot deploy to the cluster."
            exit 1
          fi
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Update the deployed image
        run: |
          kubectl set image deployment/ci-cd-kube \
            ci-cd-kube=${IMAGE}:main-${GITHUB_SHA::7}

      - name: Wait for the rollout
        run: |
          kubectl rollout status deployment/ci-cd-kube --timeout=120s

  notify:
    name: Notify Google Chat
    runs-on: ubuntu-latest
    needs: [test, build-and-push, deploy]
    if: always()

    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Determine pipeline status
        id: status
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          # * success, failure, cancelled or skipped
          # * build-and-push and deploy are skipped on purpose for PR / tag pushes
          if [[ "$TEST_RESULT" == "cancelled" || "$BUILD_RESULT" == "cancelled" || "$DEPLOY_RESULT" == "cancelled" ]]; then
            status=cancelled
            reason="Run was cancelled (superseded by a newer run or stopped manually)"
          elif [[ "$TEST_RESULT" == "failure" ]]; then
            status=failure
            reason="Tests failed: the pipeline stopped before building any image"
          elif [[ "$BUILD_RESULT" == "failure" ]]; then
            status=failure
            reason="Docker image build or push to GHCR failed"
          elif [[ "$DEPLOY_RESULT" == "failure" ]]; then
            status=failure
            reason="Kubernetes deployment failed: the new image was not rolled out"
          else
            status=success
            reason=""
          fi
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "Pipeline status: ${status} (test=${TEST_RESULT}, build-and-push=${BUILD_RESULT}, deploy=${DEPLOY_RESULT})"

      - name: Collect failed steps
        id: failed
        if: steps.status.outputs.status == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # *get failed job steps from the GitHub API
          details=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | .name as $job | .steps[] | select(.conclusion == "failure") | "\($job) → \(.name)"' \
            2>/dev/null | paste -sd ';' - || true)
          echo "details=${details:-unknown}" >> "$GITHUB_OUTPUT"
          echo "Failed steps: ${details:-unknown}"

      - name: Find associated pull request
        id: pr
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # * find the PR that was merged to produce this commit on main, if any
          pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0]' 2>/dev/null || echo "")
          if [[ -n "$pr_json" && "$pr_json" != "null" ]]; then
            {
              echo "number=$(echo "$pr_json" | jq -r '.number')"
              echo "title=$(echo "$pr_json" | jq -r '.title')"
              echo "url=$(echo "$pr_json" | jq -r '.html_url')"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "number="
              echo "title="
              echo "url="
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Send Google Chat notification
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          STATUS: ${{ steps.status.outputs.status }}
          REASON: ${{ steps.status.outputs.reason }}
          FAILED_STEPS: ${{ steps.failed.outputs.details }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if [[ -z "$WEBHOOK_URL" ]]; then
            echo "::error::Secret GOOGLE_CHAT_WEBHOOK_URL is not set, cannot send the notification."
            exit 1
          fi

          case "$STATUS" in
            success)   icon="✅"; title="Pipeline succeeded" ;;
            failure)   icon="❌"; title="Pipeline FAILED" ;;
            cancelled) icon="⚠️"; title="Pipeline cancelled" ;;
          esac

          short_sha="${GITHUB_SHA::7}"
          commit_message=$(git log -1 --pretty=%s "$GITHUB_SHA")
          commit_author=$(git log -1 --pretty=%an "$GITHUB_SHA")

          # * google chat plain/card message
   
          payload=$(jq -n \
            --arg text "${icon} ${title} — ${GITHUB_REPOSITORY} @ ${GITHUB_REF_NAME} (${short_sha}) — ${RUN_URL}" \
            --arg title "${icon} ${title}" \
            --arg subtitle "${GITHUB_REPOSITORY} · ${GITHUB_EVENT_NAME} on ${GITHUB_REF_NAME}" \
            --arg commit "${short_sha} — ${commit_message}" \
            --arg author "${commit_author} (@${GITHUB_ACTOR})" \
            --arg status "${STATUS}" \
            --arg reason "${REASON}" \
            --arg failed "${FAILED_STEPS}" \
            --arg run_url "${RUN_URL}" \
            --arg commit_url "${COMMIT_URL}" \
            --arg pr_number "${PR_NUMBER}" \
            --arg pr_title "${PR_TITLE}" \
            --arg pr_url "${PR_URL}" \
            '
            {
              text: $text,
              cardsV2: [{
                cardId: "ci-cd-run",
                card: {
                  header: { title: $title, subtitle: $subtitle },
                  sections: [{
                    widgets: (
                      [
                        { decoratedText: { topLabel: "Status", text: $status } },
                        { decoratedText: { topLabel: "Commit", text: $commit, wrapText: true } },
                        { decoratedText: { topLabel: "Author", text: $author } }
                      ]
                      + (if $reason != "" then [{ decoratedText: { topLabel: "Failure reason", text: $reason, wrapText: true } }] else [] end)
                      + (if $failed != "" then [{ decoratedText: { topLabel: "Failed step(s)", text: $failed, wrapText: true } }] else [] end)
                      + (if $pr_number != "" then [{ decoratedText: { topLabel: "Pull Request", text: ("#" + $pr_number + " — " + $pr_title), wrapText: true } }] else [] end)
                      + [{
                          buttonList: { buttons: (
                            [
                              { text: "Open workflow run", onClick: { openLink: { url: $run_url } } },
                              { text: "View commit", onClick: { openLink: { url: $commit_url } } }
                            ]
                            + (if $pr_number != "" then [{ text: "View pull request", onClick: { openLink: { url: $pr_url } } }] else [] end)
                          ) }
                        }]
                    )
                  }]
                }
              }]
            }')

          curl --fail --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json; charset=UTF-8' \
            --data "$payload" \
            "$WEBHOOK_URL" > /dev/null
          echo "Notification sent (${STATUS})."