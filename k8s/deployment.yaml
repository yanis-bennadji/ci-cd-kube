apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-cd-kube
  namespace: ci-cd-kube
  labels:
    app: ci-cd-kube
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ci-cd-kube
  template:
    metadata:
      labels:
        app: ci-cd-kube
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: ci-cd-kube
          image: ghcr.io/yanis-bennadji/ci-cd-kube:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
