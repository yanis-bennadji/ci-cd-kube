<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CI/CD Kube</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }
    #status {
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    #status.ok { background: #14532d; color: #86efac; }
    #status.checking { background: #334155; color: #cbd5e1; }
    #status.error { background: #7f1d1d; color: #fca5a5; }
  </style>
</head>
<body>
  <main>
    <h1>CI/CD Kube</h1>
    <p>Frontend de vérification du déploiement</p>
    <span id="status" data-testid="status" class="checking">checking...</span>
  </main>
  <script>
    fetch('/health')
      .then((res) => {
        if (!res.ok) throw new Error('bad response');
        return res.json();
      })
      .then((data) => {
        const el = document.getElementById('status');
        el.textContent = data.status;
        el.className = data.status === 'ok' ? 'ok' : 'error';
      })
      .catch(() => {
        const el = document.getElementById('status');
        el.textContent = 'error';
        el.className = 'error';
      });
  </script>
</body>
</html>
